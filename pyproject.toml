[project]
name = "hiver-support-agent"
version = "0.1.0"
description = "Brand-specific AI customer-support agent (SpotifyCares) with an evaluation harness — Hiver SDE intern take-home"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
    "httpx>=0.27",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pandas>=2.2",
    "py3langid>=0.3",
    "pyarrow>=17",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "rank-bm25>=0.2.2",
    "rich>=13",
    "scikit-learn>=1.5",
    "scipy>=1.14",
    "sentence-transformers>=3.0",
    "tqdm>=4.66",
    "typer>=0.12",
]

[project.scripts]
support-agent = "support_agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/support_agent"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
